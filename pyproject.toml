[project]
name = "prodigal"
version = "0.1.0"
description = "Local Ollama agent for candidate information collection (Phase 1 foundation)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
